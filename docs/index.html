<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undergraduate Electrical Engineering Student</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --text: #1f2937;
        --muted: #4b5563;
        --card: #ffffff;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(90vw, 760px);
        background: var(--card);
        border: 1px solid rgba(37, 99, 235, 0.12);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        padding: 48px 32px;
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1.3;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.35rem);
        color: var(--muted);
        line-height: 1.7;
      }

      .construction {
        margin-top: 22px;
        font-weight: 300;
        font-style: italic;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 19px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hii, I'm simran...</h1>
      <h2>An undergraduate electrical engineering student at Kathmandu University</h2>
      <p class="construction">site under construction</p>
    </main>
  </body>
</html>
